apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: airflow-eks-cluster
  region: ap-south-1

managedNodeGroups:
  - name: airflow-nodes
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 30
    ssh:
      allow: false
    labels:
      role: airflow
    tags:
      nodegroup-role: airflow