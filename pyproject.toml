[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-analytics"
version = "0.1.0"
description = "Marketing Mix Modeling and Forecasting Platform"
authors = [
    { name = "Rohit Kadam" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "snowflake-connector-python",
    "snowflake-sqlalchemy",
    "python-dotenv",
    "mlflow",
    "datadog",
    "ruff>=0.15.4",
    "black[jupyter]>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false